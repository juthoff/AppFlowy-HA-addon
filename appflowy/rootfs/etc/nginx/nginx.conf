worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8099;
        client_max_body_size 10M;
        underscores_in_headers on;

        set $appflowy_cloud_backend "http://127.0.0.1:8000";
        set $gotrue_backend "http://127.0.0.1:9999";
        set $admin_frontend_backend "http://127.0.0.1:3000";
        set $minio_backend "http://127.0.0.1:9001";
        set $minio_api_backend "http://127.0.0.1:9000";

        # appflowy_cloud's health check is registered unprefixed as GET /health
        # (source: src/application.rs, `.route("/health", ...)`), not under /api.
        # The desktop/mobile clients probe it at /api/health when verifying a
        # self-hosted server URL, which without this rule falls through to the
        # generic /api proxy_pass below - a path appflowy_cloud doesn't serve,
        # hence "Health check failed (HTTP 404)". Also handle a bare /health
        # request the same way, since it would otherwise be swallowed by the
        # AppFlowy Web catch-all further down and return the SPA instead of a
        # real health check.
        location = /api/health {
            proxy_pass $appflowy_cloud_backend/health;
            proxy_set_header Host $http_host;
        }

        location = /health {
            proxy_pass $appflowy_cloud_backend/health;
            proxy_set_header Host $http_host;
        }

        # GoTrue (authentication)
        location /gotrue/ {
            proxy_pass $gotrue_backend;
            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }

        # Realtime collaboration WebSocket
        location /ws {
            proxy_pass $appflowy_cloud_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;

            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                proxy_pass $appflowy_cloud_backend;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }

            location /api/chat {
                proxy_pass $appflowy_cloud_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                proxy_pass $appflowy_cloud_backend;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }

        # MinIO console (object storage browser), reachable via the admin portal
        location /minio/ {
            proxy_pass $minio_backend;
            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
        }

        # MinIO presigned-URL API (used by AppFlowy clients to fetch/upload files)
        location /minio-api/ {
            proxy_pass $minio_api_backend;
            # presigned URLs are signed against this internal host:port - do not change
            proxy_set_header Host "127.0.0.1:9000";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            rewrite ^/minio-api/(.*) /$1 break;
            proxy_connect_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
        }

        # Admin console
        location /console {
            proxy_pass $admin_frontend_backend;
            proxy_set_header X-Scheme $scheme;
            proxy_set_header Host $host;
        }

        # AppFlowy Web (static build, same origin - no CORS needed)
        root /opt/appflowy/web;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
